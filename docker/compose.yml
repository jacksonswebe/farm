# Local development: Postgres only. The app runs on the host via `pnpm dev`
# so hot reload works. `docker compose -f docker/compose.yml up -d`

name: safesphere-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safesphere
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: safesphere
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Applied in filename order on first boot of an empty volume
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safesphere -d safesphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: a local S3 so attachment upload works offline.
  # Start with: docker compose --profile storage up -d
  minio:
    image: minio/minio:latest
    profiles: ["storage"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: safesphere
      MINIO_ROOT_PASSWORD: localdev123
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
